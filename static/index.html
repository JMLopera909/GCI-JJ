<body class="bg-surface-container-low min-h-screen flex flex-col justify-center items-center p-md md:p-lg antialiased">
<!-- Main Container -->
<main class="w-full max-w-[440px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0_4px_12px_rgba(9,30,66,0.08)] relative overflow-hidden">
<!-- Subtle Top Accent -->
<div class="absolute top-0 left-0 right-0 h-xs bg-primary"></div>
<!-- Branding Header -->
<div class="flex flex-col items-center justify-center mb-xl">
<div class="flex items-center gap-base mb-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">GCI-JJ</h1>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface text-center mb-xs">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Ingresa tus credenciales para acceder al sistema.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST" id="loginForm">
<!-- Email/Username Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Nombre de usuario o correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none">person</span>
<input class="w-full h-[48px] pl-[44px] pr-md rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" id="username" name="username" placeholder="ejemplo@gci-jj.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none">lock</span>
<input class="w-full h-[48px] pl-[44px] pr-md rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-sm bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container transition-colors flex items-center justify-center gap-base focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm" type="submit">
                    Iniciar sesión
                    <span class="material-symbols-outlined text-[20px]">login</span>
</button>
<div id="loginFeedback" role="status" aria-live="polite" class="mt-4 text-sm font-body-md text-error hidden"></div>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg relative flex items-center justify-center">
<hr class="w-full border-outline-variant"/>
<span class="absolute bg-surface-container-lowest px-sm font-caption text-caption text-on-surface-variant uppercase tracking-wider">O</span>
</div>
<!-- Create Account Action -->
<div>
<a class="w-full h-[48px] flex items-center justify-center border-2 border-primary text-primary font-label-md text-label-md rounded-lg hover:bg-surface-container-low transition-colors gap-base" href="Rpacientes.html">
<span class="material-symbols-outlined text-[20px]">person_add</span>
                    Crear cuenta
                </a>
</div>
</div>
<!-- Footer Text (Optional for Login) -->
<div class="mt-lg text-center">
<p class="font-caption text-caption text-on-surface-variant">
                Al iniciar sesión, aceptas nuestros <a class="text-primary hover:underline" href="#">Términos de Servicio</a> y <a class="text-primary hover:underline" href="#">Política de Privacidad</a>.
            </p>
</div>
